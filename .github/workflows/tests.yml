name: Tests

# Unit tests (no live LLM: everything is stubbed) and lint, on every PR and on
# pushes to develop/main. tests/live/ needs a running agent and a paid model,
# so it is never run here.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and the agent
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      # BESSER's price file and model catalog, which tests/test_token_tracker.py
      # pins the agent's copies to (it skips without them).
      - name: Check out BESSER's LLM data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: BESSER-PEARL/BESSER
          ref: development
          path: .besser
          persist-credentials: false
          # The old directory until BESSER moves the files to besser/llm/data.
          sparse-checkout: |
            besser/llm/data
            besser/spec_driven_agent/providers/data
      - name: Run the unit tests
        env:
          BESSER_CHECKOUT: ${{ github.workspace }}/.besser
        run: python -m pytest tests -q --tb=short --ignore=tests/live

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.6 import-linter==2.15
      - name: Lint (rules in ruff.toml)
        run: ruff check src patches modeling_agent.py
      # import-linter locates the packages; it does not import them, so no dependencies.
      - run: python -m pip install --no-deps -e .
      - name: Import layers (contracts in pyproject.toml)
        run: lint-imports
